<!doctype html>
<html lang="fr">
<head>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Le Petit Berger</title>
<link rel="manifest" href="./manifest.webmanifest">

<link rel="icon" href="./icon-192.png">
<style>
:root{color-scheme:light;--papier:#f9f3e4;--encre:#243d33;--foret:#26483b;--mousse:#556c56;--trais:#dfd6c0;--ambre:#a16437;--ombre:0 1px 4px #172a2224,0 7px 23px #233e3033;--livre:Georgia,'Times New Roman',serif;--texte:system-ui,-apple-system,sans-serif;--haut:max(12px,env(safe-area-inset-top));--bas:max(13px,env(safe-area-inset-bottom));--gauche:max(13px,env(safe-area-inset-left));--droite:max(13px,env(safe-area-inset-right))}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{font-family:var(--texte);color:var(--encre);background:#bccdaf;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.62;cursor:default}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #bc743c;outline-offset:3px}button:active:not(:disabled){transform:scale(.97)}[hidden]{display:none!important}
.app,.stage{height:100%;height:100dvh;width:100%;position:relative;overflow:hidden}.stage{isolation:isolate;background:#cdddc0;touch-action:none}#world,.paper-texture{position:absolute;inset:0;width:100%;height:100%;display:block}#world{touch-action:none;cursor:crosshair}#world:focus-visible{outline-offset:-7px}.paper-texture{pointer-events:none;background-size:390px;mix-blend-mode:multiply;opacity:.14;z-index:1}
.overlay{position:absolute;z-index:2;pointer-events:none}.overlay button{pointer-events:auto}

.note-wrap{grid-column:1;grid-row:1;max-width:260px}.notes{margin:0;padding:8px 10px;border-left:3px solid #c29258;border-radius:3px 10px 10px 3px;background:#faf4e4eb;color:#384d3e;font-size:11px;line-height:1.35;box-shadow:0 2px 8px #263f311f}
.hint-compass{grid-column:1/-1;justify-self:end;max-width:100%;display:flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid #f5e1b2;color:#61442f;background:#fff4d8ed;border-radius:100px;font-size:11px;font-weight:740}.hint-compass b{display:inline-block;font-size:19px;line-height:1}.map-label{transform:translate(-50%,-100%);border-radius:100px;background:#fff4daed;padding:5px 8px;color:#514329;border:1px solid #ecd5a6;font-size:11px;font-weight:760;white-space:nowrap}
.toast{position:absolute;z-index:3;bottom:calc(var(--bas) + 125px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(390px,calc(100% - 26px));padding:9px 13px;background:#244739ee;color:#fff5df;font-size:12px;font-weight:710;line-height:1.32;text-align:center;border-radius:10px;box-shadow:var(--ombre);pointer-events:none}
.stage-bottom{inset:auto var(--droite) var(--bas) var(--gauche);display:flex;justify-content:space-between;align-items:flex-end;gap:7px}.joystick{width:100px;height:100px;position:relative;border-radius:100%;border:1.5px solid #fff8e9e9;background:#faf0dba8;box-shadow:var(--ombre);touch-action:none;padding:0;display:none;place-items:center}.joystick::before{content:'';position:absolute;inset:13px;border:1px dashed #4e655c88;border-radius:50%}.joystick-thumb{width:46px;height:46px;display:block;position:relative;border-radius:50%;background:#406450;border:2px solid #fff7df;box-shadow:0 2px 8px #213b30a0;pointer-events:none}.joystick:active{transform:none!important}
.controls-label{padding:9px 12px;border-radius:100px;background:#faf4e5ec;font-size:11px;font-weight:660;white-space:nowrap}.play-actions{display:grid;grid-template-columns:auto auto;align-items:end;justify-content:end;gap:6px}.sprint,.bark,.interact{min-height:48px;font-size:13px;font-weight:750;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--ombre);border:1px solid #fff8e6;white-space:nowrap;padding:6px 11px}.sprint{color:var(--foret);background:#faf3dee9;touch-action:none}.bark,.interact{touch-action:none}.sprint[aria-pressed="true"]{background:#865338;color:#fff1da}.bark{background:var(--foret);color:#fff6df;min-height:59px;padding:6px 14px}.bark[data-cooling="true"]{background:#58745e}.bark canvas{width:22px;height:22px}.interact{grid-column:1/-1;justify-self:end;background:#f3cf91;color:#513d29;padding-inline:14px}kbd{font:700 10px var(--texte);padding:3px 5px;border-radius:4px;background:#f8eed6;color:#3e5e4c}.bark kbd{background:#ffffff21;color:#fff5df}
.home{position:absolute;z-index:4;inset:0;background:var(--papier);display:grid;grid-template-rows:minmax(190px,54%) minmax(0,1fr);overflow:auto;overscroll-behavior:contain}.cover{background:#abba9b var(--cover) 53% 58%/cover no-repeat;position:relative;min-height:190px}.cover-paw{position:absolute;width:48px;height:48px;padding:9px;top:var(--haut);left:var(--gauche);background:#f7edda;border-radius:50%;box-shadow:var(--ombre)}.home-content{background:var(--papier);padding:19px max(20px,var(--gauche)) calc(var(--bas) + 9px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;position:relative;min-height:min-content}.home-content::before{position:absolute;content:'';width:100%;height:19px;left:0;top:-18px;background:var(--papier);border-radius:18px 18px 0 0}.home h1{margin:0 0 8px;font:500 clamp(46px,12vw,83px)/.89 var(--livre);letter-spacing:-.083em;text-wrap:balance}.home h1 em{display:inline-block;color:#426750;font-weight:500}.home p{margin:0 0 13px;font-size:14px;line-height:1.45;color:#536754;max-width:37ch;text-wrap:pretty}.home-actions{display:grid;gap:7px;width:100%;max-width:350px}.home-progress{font-size:11px;font-weight:700;color:var(--mousse);margin-top:10px}.home h1:focus{outline:none}
.primary,.secondary{min-height:48px;padding:9px 14px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:760;text-align:center;line-height:1.22}.primary{background:var(--foret);color:#fff6df}.secondary{background:#fff8e9;color:var(--encre);border-color:#dfd2b5}.home .secondary{background:transparent}.primary:hover:not(:disabled){background:#315d4c}.secondary:hover:not(:disabled){background:#efe9d4}.control-explainer{display:grid;gap:4px;margin:12px 0 16px;padding:10px 12px;border-radius:11px;background:#e8ecd8;color:#395743;font-size:12px}.control-explainer p{margin:0;color:#395743}
dialog{width:min(440px,100% - 22px);max-height:calc(100dvh - var(--haut) - var(--bas) - 8px);margin:auto;padding:20px;border:1px solid #eaddc6;border-radius:20px;background:var(--papier);color:var(--encre);box-shadow:0 12px 50px #172c245c;overflow:auto;overscroll-behavior:contain}dialog::backdrop{background:#253b3282;backdrop-filter:blur(3px)}dialog h2{font:500 clamp(28px,7vw,41px)/.96 var(--livre);letter-spacing:-.055em;margin:0 43px 8px 0;text-wrap:balance}dialog p{margin:0 0 12px;color:#4f6453;font-size:14px;line-height:1.48}.dialog-close{position:absolute;right:11px;top:11px;box-shadow:none;border:1px solid var(--trais);background:#fff8e6;font-size:23px;font-weight:440}.dialog-buttons{display:flex;gap:6px;flex-wrap:wrap}.dialog-buttons>*{flex:1 1 auto}.challenge{background:#eee6ce;border-radius:10px;padding:9px 12px;color:#694f35;font-size:12px;font-weight:720;margin-bottom:14px}.dialog-actions{display:grid;gap:7px}
.chapter-list{list-style:none;padding:0;margin:0;display:grid;gap:5px}.region-label{font:500 23px/1 var(--livre);margin:13px 1px 3px;letter-spacing:-.036em}.chapter-list button{width:100%;min-height:52px;text-align:left;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;background:#fff8e8;border:1px solid #e5d9bc;border-radius:10px;padding:7px}.chapter-list button[aria-current="step"]{border-color:#7e9b76;background:#f4f1dc}.chapter-index{background:#e8ebd5;border-radius:8px;text-align:center;font:500 17px/31px var(--livre);height:31px}.chapter-list strong,.chapter-list small{display:block}.chapter-list strong{font-size:13px;line-height:1.28}.chapter-list small{color:#566b57;margin-top:3px;font-size:10.5px}.mission-stars{color:#9b632e;font-size:14px;letter-spacing:1px;white-space:nowrap}.award-list{list-style:none;padding:0;margin:14px 0 17px;display:grid;gap:4px}.award-list li{display:flex;gap:8px;align-items:center;min-height:36px;padding:6px 8px;border-bottom:1px solid #e3dac4;font-size:13px}.award-list b{color:#996336}.award-list li[data-earned="false"] b{color:#748072}
.orientation{position:absolute;inset:0;z-index:7;background:var(--papier);display:grid;align-content:center;justify-items:center;gap:10px;padding:25px;text-align:center}
.orientation-glyph{font-size:43px;color:#ac6c43}.orientation strong{font:600 36px var(--livre);letter-spacing:-.055em}.orientation p{font-size:14px;line-height:1.5;max-width:31ch;margin:0 0 10px;color:var(--mousse)}
.error,.loading{position:absolute;inset:0;z-index:5;padding:23px;background:var(--papier);display:grid;place-content:center;text-align:center;font-size:14px;font-weight:700}
@media(any-pointer:coarse),(max-width:740px){.joystick{display:grid}.controls-label,.play-actions kbd{display:none}}
@media(min-width:740px) and (orientation:landscape){.home{grid-template-columns:minmax(0,56%) 1fr;grid-template-rows:1fr}.cover{height:auto}.home-content{padding:30px clamp(25px,4.5vw,75px)}.home-content::before{display:none}.home h1{font-size:clamp(55px,7vw,105px)}.hud{max-width:560px}.mission-tag{min-width:240px}.mini-map{width:115px;height:79px}.note-wrap{max-width:280px}}
@media(max-width:360px){.counter{font-size:10px;gap:2px;padding-inline:2px 6px}.counter canvas{width:20px;height:20px}.mission-tag{padding-inline:8px}.hud-time{font-size:11px}.help-strip{gap:4px 6px}}
@media(max-height:650px) and (orientation:portrait){.home{grid-template-rows:43% auto}.home h1{font-size:47px}.home-content{padding-top:10px}.home p{font-size:12.5px}.joystick{width:88px;height:88px}.toast{bottom:calc(var(--bas) + 107px)}.notes{font-size:10px}}
@media(max-height:480px) and (orientation:landscape){
.hud{max-width:none}.hud-bar{max-width:min(420px,calc(100% - 96px))}.mission-tag{min-width:0}
.help-strip{display:block}.map-wrap{position:absolute;top:0;right:0}.note-wrap{max-width:min(235px,42vw)}.hint-compass{position:absolute;right:0;top:87px}
.joystick{display:grid}.controls-label,.play-actions kbd{display:none}.play-actions .sprint,.play-actions .bark{min-width:62px;min-height:54px}.play-actions .interact{min-height:44px}
.home{grid-template-columns:49% 1fr;grid-template-rows:1fr}.home-content{padding-block:10px}.home-content::before{display:none}.home h1{font-size:46px}.home p{font-size:12px}.home .primary,.home .secondary{min-height:42px}.joystick{width:74px;height:74px}.joystick-thumb{width:35px;height:35px}.toast{bottom:calc(var(--bas) + 82px)}.notes{font-size:10px}.bark{min-height:46px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <section class="stage" id="stage" aria-label="Terrain de la mission" aria-busy="true">
    <canvas id="world" tabindex="0" aria-label="Terrain. Flèches haut et bas pour avancer et reculer, gauche et droite pour tourner. Maj pour sprinter, Espace pour aboyer, E pour interagir. Glisse à droite pour déplacer la caméra."></canvas>
    <div class="paper-texture" id="paper" aria-hidden="true"></div>
    <div class="hud overlay">
      <div class="hud-bar">
        <button id="pause" class="circle" type="button" aria-label="Mettre en pause" aria-haspopup="dialog">Ⅱ</button>
        <div class="mission-tag">
          <div><div class="chapter-kicker" id="chapter-kicker"></div><h1 id="mission-title">Le Petit Berger</h1></div>
          <span id="mission-timer" class="hud-time" aria-label="Temps de jeu">0:00</span>
        </div>
        <button id="hint" class="circle" type="button" aria-label="Obtenir un indice"><canvas data-icon="compass" width="48" height="48" aria-hidden="true"></canvas></button>
      </div>
      <div id="counts" class="progress" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="help-strip">
        <div class="note-wrap" id="notes-wrap"><p id="mission-note" class="notes"></p></div>
        <div class="map-wrap" aria-hidden="true">
          <canvas class="mini-map" id="mini-map" width="220" height="152"></canvas>
          <span class="weather-chip"><span id="weather-icon">☀</span> <span id="weather"></span></span>
        </div>
        <div class="hint-compass" id="hint-compass" hidden aria-hidden="true"><b id="compass-arrow">↑</b><span id="compass-distance"></span></div>
      </div>
    </div>
    <div class="map-label overlay" id="map-label" hidden aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="stage-bottom overlay">
      <div class="controls-label" aria-hidden="true"><kbd>↑ ↓</kbd> Avancer, reculer <kbd>← →</kbd> Tourner</div>
      <button class="joystick" id="joystick" type="button" aria-label="Joystick de déplacement. Haut pour avancer, bas pour reculer et côtés pour tourner."><span class="joystick-thumb" id="joystick-thumb"></span></button>
      <div class="play-actions">
        <button class="interact" id="interact" type="button" hidden>Interagir</button>
        <button class="sprint" id="sprint" type="button" aria-pressed="false">Sprint <kbd aria-hidden="true">Maj</kbd></button>
        <button class="bark" id="bark" type="button"><canvas data-icon="bark" width="48" height="48" aria-hidden="true"></canvas>Aboyer <kbd aria-hidden="true">Espace</kbd></button>
      </div>
    </div>
    <div class="orientation" id="rotate-landscape" hidden>
      <div class="orientation-glyph" aria-hidden="true">↻</div>
      <strong>Tourne ton téléphone</strong>
      <p>Passe en paysage pour garder le pouce gauche sur le joystick et regarder avec le droit.</p>
      <button type="button" class="secondary" id="rotate-back">Retour à l’accueil</button>
    </div>
    <div class="error" id="error" role="alert" hidden></div>
  </section>
  <section id="home" class="home" aria-labelledby="home-title">
    <div class="cover" aria-hidden="true"><canvas class="cover-paw" data-icon="paw" width="48" height="48"></canvas></div>
    <div class="home-content">
      <h1 id="home-title" tabindex="-1">Le Petit <em>Berger</em></h1>
      <p>Pars avec Nuage. Retrouve, rassemble et mène chaque troupeau à l’abri.</p>
      <div class="home-actions">
        <button class="primary" id="play" type="button" disabled>Préparation du jeu…</button>
        <button class="secondary" id="chapters" type="button" aria-haspopup="dialog" disabled>Carnet des missions</button>
        <button class="secondary" id="install" type="button" hidden>Installer sur cet appareil</button>
        <button class="secondary" id="update-game" type="button" hidden>Actualiser le jeu</button>
      </div>
      <div id="home-progress" class="home-progress" aria-live="polite"></div>
    </div>
  </section>
</main>
<dialog id="chapter-dialog" aria-labelledby="chapter-title">
<button type="button" class="circle dialog-close" aria-label="Fermer le carnet" data-close>×</button>
<h2 id="chapter-title">Carnet des missions</h2>
<p id="book-progress"></p>
<ol class="chapter-list" id="chapter-list"></ol>
</dialog>
<dialog id="brief-dialog" aria-labelledby="brief-title">
<button type="button" class="circle dialog-close" aria-label="Fermer la fiche de mission" data-close>×</button>
<h2 id="brief-title"></h2>
<p id="brief-text"></p>
<div class="control-explainer"><p id="brief-note"></p></div>
<p class="challenge" id="brief-challenge"></p>
<button id="start-mission" class="primary" type="button">Partir avec Nuage</button>
</dialog>
<dialog id="pause-dialog" aria-labelledby="pause-title">
<button type="button" class="circle dialog-close" aria-label="Reprendre la mission" data-close>×</button>
<h2 id="pause-title">En pause</h2>
<p id="pause-goal"></p>
<p class="challenge" id="pause-challenge"></p>
<div class="dialog-actions">
  <button id="resume" class="primary" type="button">Reprendre</button>
  <button id="pause-book" class="secondary" type="button">Choisir une mission</button>
  <button id="restart" class="secondary" type="button">Recommencer</button>
  <button id="sky-mode" class="secondary" type="button">Météo automatique</button>
  <button id="sound" class="secondary" type="button" aria-pressed="false">Son désactivé</button>
  <button id="home-button" class="secondary" type="button">Retour à l’accueil</button>
</div>
</dialog>
<dialog id="win-dialog" aria-labelledby="win-title">
<button type="button" class="circle dialog-close" aria-label="Fermer le bilan" data-close>×</button>
<h2 id="win-title"></h2>
<p id="win-text"></p>
<ul id="win-awards" class="award-list"></ul>
<div class="dialog-buttons">
<button id="next" class="primary" type="button"></button>
<button id="replay" class="secondary" type="button">Rejouer</button>
</div>
</dialog>
<script defer src="./three.min.js"></script>
<script defer src="./assets.js"></script>
<script defer src="./game.js"></script>
<script defer src="./launch.js"></script>
</body>
</html>
